<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zyphor — Secure assessments</title>
  <meta name="author" content="Zyphor">
  <meta name="description" content="Zyphor — secure online assessments, live coding, participant management, and results.">
  <meta name="theme-color" content="#0c1626">
  <link rel="icon" type="image/png" href="%BASE_URL%zyphor.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      var t = localStorage.getItem("zyphor_theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
